# .ai/manifest.yaml - the agent-facing contract for this repo.
# Minimal on purpose: it declares which registry skills this project uses and the one gate that
# CLAUDE.md documents. Unknown fields must be ignored by readers. Grow it only with facts that
# were run, not guessed.
schema: ai-manifest
schemaVersion: 0.1.0
spec: .ai/SPEC.md
generatedAt: "2026-10-22"
generatedFrom: [CLAUDE.md, apps/vr/tools/build.ps1, docs/ORCHESTRATION.md, .github/workflows/quality.yml, tools/check-repo-law.mjs]

repo:
  name: mage-arena-vr
  purpose: "Seated, hands-first spell duel for Meta Quest, built in Unreal Engine 5.8 (desktop-first until 2026-10-31)"
  languages: [cpp, powershell, javascript]

# Capabilities, not tools. `verified` flips to true only after a session has run the command:
# `node .ai/doctor.mjs --run` executes each one and writes the outcome back. Every flag below is false
# until that run; none was set by hand.
# CLAUDE.md records a successful build on 2026-10-02 (54 s, UE 5.8.2); this manifest has not re-run it.
# test: the agy worker guard, the pinned-data sha256 gate and the VR overlay check (each with its self-test), and the
# Leonardo redaction harness (findings L1, S1, S2, S3, P1). Same list, same order as quality.yml's test step.
# lint: private/protected C++ members nothing reads or writes (the case clang misses inside a UCLASS).
# format: clang-format on changed C++ lines only; needs clang-format installed (README "Build and test").
# The UE automation suite (`MageArena.*`, README "Build and test") is not a capability: one run is longer
# than the doctor's 180 s budget.
# build: TWO reasons this stays `verified: false`, and they are separate. (1) Unreal lives only on Wolf
# (DECISIONS 2026-10-20 "Unreal host"), so no Lynx session can run it at all. (2) The recorded command cannot
# run on Lynx even to fail honestly: `powershell -NoProfile -File <script>` is blocked by this machine's
# execution policy, which needs `-ExecutionPolicy Bypass`. The command is left as the Wolf form on purpose -
# it is the one CLAUDE.md documents - so a Lynx run reports "cannot run here", not a false green. Until
# f3b9efe the script itself exited 0 with no engine, which WAS a false green; it now exits 2.
capabilities:
  build: { command: "powershell -NoProfile -File apps/vr/tools/build.ps1", verified: false }
  test: { command: "node --test tools/agy-guard.test.mjs && node apps/vr/tools/check-pin.mjs && node apps/vr/tools/check-pin.mjs --self-test && node apps/vr/tools/check-overlay.mjs && node apps/vr/tools/check-overlay.mjs --self-test && node --test apps/vr/tools/keyart/leonardo-redaction.test.mjs", verified: false }
  lint: { command: "node apps/vr/tools/lint/unused-members.mjs", verified: false }
  format: { command: "node apps/vr/tools/lint/format-check.mjs", verified: false }
  repoLaw: { command: "node tools/check-repo-law.mjs && node tools/check-repo-law.mjs --self-test", verified: false }

paths:
  contextIndex: .ai/context-index.json
  memory: .ai/memory/
  guardrails: .ai/guardrails.yaml

boundaries:
  # Never hand-edited. Pinned data changes only through a re-pin task (apps/vr/data/README.md); conformance
  # vectors and clips are regenerated byte-identically by their generators under apps/vr/tools/.
  neverTouch: [apps/vr/data/pinned/, apps/vr/data/PINNED.json, apps/vr/data/conformance/, apps/vr/Game/Clips/]
  # Names, never values. Nothing secret lives in this repository.
  secretsFrom: "ELEVENLABS_API_KEY: process env, else kiro/pof/.env, read by name at run time by apps/vr/tools/sfx/generate.mjs (docs/ORCHESTRATION.md). LEONARDO_API_KEY: kiro/bp/.env (untracked, outside every worktree), read by name at run time by readKey() in apps/vr/tools/assets/leonardo-client.mjs. ASCENT_CONFORMANCE_URL / ASCENT_CONFORMANCE_TOKEN: GitHub Actions repository secrets, read by .github/workflows/ai-conformance.yml."

# Who works here (docs/ORCHESTRATION.md has the roles). Workers implement one task card each and never
# commit; the orchestrator verifies by running the card's checks and commits. agy runs behind the
# PreToolUse guard in .agents/hooks.json (tools/agy-guard.mjs).
agents:
  - { id: claude-orchestrator, kind: claude-code, entrypoint: CLAUDE.md }
  - { id: grok-worker, kind: grok-cli, entrypoint: tools/grok-run.sh }
  - { id: agy-worker, kind: antigravity-cli, entrypoint: tools/agy-run.sh }
  - { id: agy-reviewer, kind: antigravity-cli, entrypoint: tools/agy-review.sh }

# One authority. The worker dispatchers bind Grok and agy to CLAUDE.md in their prompts; there are no projections.
guidance:
  canonical: CLAUDE.md

# Control placement. CI runs these on every pull request AND on every push to master
# (.github/workflows/quality.yml, 459c45c) - it was pull-request-only until then, which left the path CLAUDE.md
# actually mandates ("push verified work to origin master") meeting no gate at all.
# A pre-push hook is now installable: `node tools/install-hooks.mjs` (80cdc80). It is NOT automatic - .git/hooks
# is not tracked, so every clone and worktree installs it once for itself, and CI is the backstop that cannot be
# skipped per clone. The hook preserves the Git LFS pre-push hook verbatim and execs it last.
# repoLaw: tools/check-repo-law.mjs (711ac90) guards four laws that were stated in docs and enforced nowhere:
# the two separate bBuildEditor blocks (DECISIONS 2026-10-16), LFS coverage for binary extensions outside
# apps/vr/art/, the never-committed directories, and the Node-built-ins-only rule.
# `prePush` is deliberately NOT declared, and this is the reasoning so it is not re-litigated: the doctor's
# control-placement check recognises a hook runner only by a TRACKED lefthook.yml, .pre-commit-config.yaml or
# .husky/, and this repo's hook is a raw .git/hooks/pre-push, which is machine state and cannot be tracked.
# Declaring prePush here would therefore be a permanent hard fail that no amount of work could clear, and a
# gate that is always red teaches everyone to ignore the doctor. Adopting lefthook to satisfy the check would
# add a tool dependency to a deliberately zero-dependency repo. The shift-left goal is met the other way:
# quality.yml now runs on push to master, which is the path CLAUDE.md actually mandates, so the gate binds
# there with or without a local hook. The hook is an accelerator, not the control.
controls:
  ciHardPass: [lint, test, format, repoLaw]

# Registry skills this project consumes. scripts/link-registry.mjs in the registry makes
# .claude/skills/<name> a local, gitignored link to each one.
skills:
  - scan-sweep
  - perfect
