# .ai/manifest.yaml - the agent-facing contract for this repo.
# Minimal on purpose: it declares which registry skills this project uses and the one gate that
# CLAUDE.md documents. Unknown fields must be ignored by readers. Grow it only with facts that
# were run, not guessed.
schema: ai-manifest
schemaVersion: 0.1.0
spec: .ai/SPEC.md
generatedAt: "2026-10-05"
generatedFrom: [CLAUDE.md, apps/vr/tools/build.ps1, docs/ORCHESTRATION.md, .github/workflows/quality.yml]

repo:
  name: mage-arena-vr
  purpose: "Seated, hands-first spell duel for Meta Quest, built in Unreal Engine 5.8 (desktop-first until 2026-10-31)"
  languages: [cpp, powershell, javascript]

# Capabilities, not tools. `verified` flips to true only after a session has run the command:
# `node .ai/doctor.mjs --run` executes each one and writes the outcome back. Every flag below is false
# until that run; none was set by hand.
# CLAUDE.md records a successful build on 2026-10-02 (54 s, UE 5.8.2); this manifest has not re-run it.
# test: the agy worker guard and the pinned-data sha256 gate (plus its flipped-byte self-test).
# lint: private/protected C++ members nothing reads or writes (the case clang misses inside a UCLASS).
# format: clang-format on changed C++ lines only; needs clang-format installed (README "Build and test").
# The UE automation suite (`MageArena.*`, README "Build and test") is not a capability: one run is longer
# than the doctor's 180 s budget.
capabilities:
  build: { command: "powershell -NoProfile -File apps/vr/tools/build.ps1", verified: false }
  test: { command: "node --test tools/agy-guard.test.mjs && node apps/vr/tools/check-pin.mjs && node apps/vr/tools/check-pin.mjs --self-test", verified: false }
  lint: { command: "node apps/vr/tools/lint/unused-members.mjs", verified: false }
  format: { command: "node apps/vr/tools/lint/format-check.mjs", verified: false }

paths:
  contextIndex: .ai/context-index.json
  memory: .ai/memory/
  guardrails: .ai/guardrails.yaml

boundaries:
  # Never hand-edited. Pinned data changes only through a re-pin task (apps/vr/data/README.md); conformance
  # vectors and clips are regenerated byte-identically by their generators under apps/vr/tools/.
  neverTouch: [apps/vr/data/pinned/, apps/vr/data/PINNED.json, apps/vr/data/conformance/, apps/vr/Game/Clips/]
  # Names, never values. Nothing secret lives in this repository.
  secretsFrom: "ELEVENLABS_API_KEY: process env, else kiro/pof/.env, read by name at run time by apps/vr/tools/sfx/generate.mjs (docs/ORCHESTRATION.md). ASCENT_CONFORMANCE_URL / ASCENT_CONFORMANCE_TOKEN: GitHub Actions repository secrets, read by .github/workflows/ai-conformance.yml."

# Who works here (docs/ORCHESTRATION.md has the roles). Workers implement one task card each and never
# commit; the orchestrator verifies by running the card's checks and commits. agy runs behind the
# PreToolUse guard in .agents/hooks.json (tools/agy-guard.mjs).
agents:
  - { id: claude-orchestrator, kind: claude-code, entrypoint: CLAUDE.md }
  - { id: grok-worker, kind: grok-cli, entrypoint: tools/grok-run.sh }
  - { id: agy-worker, kind: antigravity-cli, entrypoint: tools/agy-run.sh }
  - { id: agy-reviewer, kind: antigravity-cli, entrypoint: tools/agy-review.sh }

# One authority. The worker dispatchers bind Grok and agy to CLAUDE.md in their prompts; there are no projections.
guidance:
  canonical: CLAUDE.md

# Control placement. CI runs these on every pull request (.github/workflows/quality.yml). No local hook is
# installed yet, so no pre-push control is declared; an agent runs the same commands before it proposes a change.
controls:
  ciHardPass: [lint, test, format]

# Registry skills this project consumes. scripts/link-registry.mjs in the registry makes
# .claude/skills/<name> a local, gitignored link to each one.
skills:
  - scan-sweep
