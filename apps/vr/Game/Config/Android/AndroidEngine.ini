; Android-only. Desktop DefaultEngine.ini is unchanged apart from the shared forward-shading flag.
; Quest 3 / OpenXR device profiles also set vr.MobileMultiView. ShadingPath 0 is mobile forward,
; which packaged UE 5.8 Meta samples need.

[ConsoleVariables]
vr.MobileMultiView=1
r.Mobile.MultiView=1
r.Mobile.ShadingPath=0
