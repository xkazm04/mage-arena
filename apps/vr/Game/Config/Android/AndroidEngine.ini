; Android-only. DefaultEngine.ini's renderer settings (forward shading, MSAA, occlusion queries off) also apply on Android.
; Quest 3 / OpenXR device profiles also set vr.MobileMultiView. ShadingPath 0 is mobile forward,
; which packaged UE 5.8 Meta samples need.

[ConsoleVariables]
vr.MobileMultiView=1
r.Mobile.MultiView=1
r.Mobile.ShadingPath=0
; T56 dusk sun: the movable directional light's shadow on Quest. Two cascades (the greybox sets two on the light) at
; 1024 texels keep the long dusk shadows soft and the shadow depth pass inside the 150 draw-call budget.
r.Shadow.CSM.MaxMobileCascades=2
r.Shadow.MaxCSMResolution=1024
