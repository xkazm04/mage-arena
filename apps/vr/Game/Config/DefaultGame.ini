[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=6D1F4B2A4C7E4E2B9A3B1C5D7E8F9A01
ProjectName=Mage Arena VR

; Clips live in Game/Clips, next to Content. Paths here are relative to the Content directory.
; Non-UFS: the loader reads them with ordinary file IO (FFileHelper), not the pak file system.
; ../Clips is staged with every subfolder, and no project setting can leave one out (UAT StageFiles AllDirectories),
; so the generated test clips (corpus, impostors, noise, mouse) live in Game/TestClips, which nothing stages.
; data/vr is the greybox layout (arena-layout.json), VR-owned, not pinned.
; pinned is the read-only combat data pin, see apps/vr/data/PINNED.json.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Clips")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../../data/vr")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../../data/pinned")
