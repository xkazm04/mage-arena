; Do not delete. While bPackageForMetaQuest=True, UE 5.8 HandleXRSupport (AndroidRuntimeSettings.cpp, called from
; PostInitProperties) appends a supportedDevices tag naming quest2 and questpro on every editor, game or cook launch and
; writes it into this file, unless ExtraApplicationSettings already contains both strings it searches for. This XML
; comment contains both, so the engine writes nothing. It reaches <application> verbatim and the Meta XR APL ignores it
; (a comment is not a meta-data element), so the APK still declares only +SupportedDevices (STACK F2, XR-TOOLCHAIN).
ExtraApplicationSettings=<!-- com.oculus.supportedDevices guard: quest2|questpro|quest3|quest3s is named here only so UE 5.8 HandleXRSupport adds no tag of its own, the real list comes from +SupportedDevices (STACK F2) -->

